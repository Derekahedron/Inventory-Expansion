modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}" #mandatory This is typically bumped every Minecraft version by Forge. See https://files.minecraftforge.net/ for a list of versions.
license = "${license}"
issueTrackerURL="https://github.com/Derekahedron/Inventory-Expansion/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"

#updateJSONURL="https://change.me.example.invalid/updates.json" #optional (see https://mcforge.readthedocs.io/en/latest/gettingstarted/autoupdate/)
displayURL="https://github.com/Derekahedron/Inventory-Expansion"
logoFile = "assets/${mod_id}/icon.png"
logoBlur = false
credits = "This mod is dedicated to my fiancée"
authors = "${mod_author}"
description = '''${description}'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

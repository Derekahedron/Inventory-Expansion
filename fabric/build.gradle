plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    flatDir{
        dir '../common/libs'
    }
    maven {
        url 'https://cursemaven.com'
        content {
            includeGroup "curse.maven"
        }
    }
    // repo for trinkets
    maven {
        name = "Ladysnake Libs"
        url = 'https://maven.ladysnake.org/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")

    modImplementation group: 'derekahedron.invexpcompat', name: "${compat_mod_id}", version: "${compat_version}"
    include group: 'derekahedron.invexpcompat', name: "${compat_mod_id}", version: "${compat_version}"

    modImplementation "curse.maven:trinkets-341284:5173501"
    modApi include("dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.0")
    modApi include("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.2.0")
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
        data {
            inherit(client)
            setConfigName("Fabric Data")
            vmArgs(
                    "-Dfabric-api.datagen",
                    "-Dfabric-api.datagen.output-dir=${file("../fabric/src/main/generated")}",
                    "-Dfabric-api.datagen.modid=${mod_id}")

            runDir("run")
        }
    }
}

fabricApi {
    configureDataGeneration() {
        client = true
        createRunConfiguration = false
    }
}